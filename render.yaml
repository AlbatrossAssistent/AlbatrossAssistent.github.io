services:
  - type: web
    name: burrow
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /tools/status
    envVars:
      - key: OLLAMA_API_KEY
        sync: false
      - key: POWER_ON_URL
        sync: false
      - key: POWER_PIN
        sync: false
