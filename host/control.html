<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burrow Control Center</title>
<style>
:root {
  --bg: #08111f; --panel: #0e1b2e; --panel2: #13233a; --line: #1f3350; --fg: #e8eef7; --muted: #8a9bb4;
  --ok: #3ddc97; --warn: #ffc857; --bad: #ff6b6b; --accent: #5aa9ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.45 "Segoe UI", system-ui, sans-serif; }
body { padding: 20px clamp(16px, 3vw, 32px) 28px; }
.wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: .2px; }
header .sub { color: var(--muted); font-size: 14px; }
header .spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); font-size: 13px; font-weight: 600; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.ok .dot, .dot.ok { background: var(--ok); box-shadow: 0 0 0 4px rgba(61,220,151,.15); }
.warn .dot, .dot.warn { background: var(--warn); box-shadow: 0 0 0 4px rgba(255,200,87,.15); animation: pulse 1.2s infinite; }
.bad .dot, .dot.bad { background: var(--bad); box-shadow: 0 0 0 4px rgba(255,107,107,.15); }
@keyframes pulse { 50% { opacity: .35; } }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; min-width: 0; }
.card h2 { margin: 0 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 10px; }
.card h2 .spacer { flex: 1; }

.hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 26px 20px 22px; background: radial-gradient(120% 140% at 50% 0%, #17345a 0%, var(--panel) 60%); }
.hero .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 2px; }
.code { font: 700 clamp(56px, 11vw, 132px)/1.05 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .06em; margin: 6px 0 4px; transition: opacity .3s; overflow-wrap: anywhere; }
.code .dash { color: var(--accent); }
.hero.off .code { opacity: .35; }
.hero .link { color: var(--muted); font-size: 14px; word-break: break-all; }
.hero .state { margin-top: 6px; font-size: 14px; font-weight: 600; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
button { font: inherit; font-size: 14px; font-weight: 600; color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; min-height: 38px; padding: 0 14px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }

.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
.tile .big { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.tile .small { color: var(--muted); font-size: 13px; margin-top: 4px; min-height: 1.4em; }
.num { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
.models { display: flex; flex-direction: column; gap: 8px; }
.model { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.model b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.model small { color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }

.feed { display: flex; flex-direction: column; max-height: 560px; overflow-y: auto; margin: 0 -8px; }
.ev { display: grid; grid-template-columns: 64px 16px minmax(0, 1fr); gap: 10px; padding: 9px 8px; border-radius: 10px; align-items: start; }
.ev.new { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: rgba(90,169,255,.18); } to { background: transparent; } }
.ev time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; padding-top: 1px; }
.ev .dot { margin-top: 6px; }
.ev .what { overflow-wrap: anywhere; }
.ev .model-name { font-weight: 600; }
.ev .msg { color: #c5d3e6; }
.ev .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
.ev.info .what { color: var(--muted); }
.ev.error .what { color: #ffb3b3; }
.spin { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--accent); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; margin-right: 4px; }
@keyframes spin { to { transform: rotate(360deg); } }
.switch { display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 17px; font-weight: 700; user-select: none; }
.switch input { appearance: none; width: 48px; height: 28px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background .2s; flex: none; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch input:checked { background: var(--ok); }
.switch input:checked::after { transform: translateX(20px); }
.switch input:disabled { opacity: .5; cursor: default; }
.switch input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.banner { background: #3a1620; border: 1px solid #6b2a36; color: #ffd0d6; border-radius: 12px; padding: 10px 14px; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Burrow Control Center</h1>
    <span class="sub" id="pcName"></span>
    <span class="spacer"></span>
    <span class="sub" id="uptime"></span>
  </header>

  <div class="banner" id="lost" hidden>Lost contact with the Burrow host. Is the Burrow host window still open?</div>

  <section class="card hero" id="hero">
    <div class="label">Your code</div>
    <div class="code" id="code">····-····</div>
    <div class="link" id="link"></div>
    <div class="state" id="heroState"></div>
    <div class="row">
      <button id="copyCode">Copy code</button>
      <button id="copyLink">Copy link</button>
    </div>
  </section>

  <section class="grid4">
    <div class="card tile"><h2>Server</h2><div class="big" id="srv"><span class="dot"></span><span></span></div><div class="small" id="srvSub"></div></div>
    <div class="card tile"><h2>Ollama</h2><div class="big" id="oll"><span class="dot"></span><span></span></div><div class="small" id="ollSub"></div></div>
    <div class="card tile"><h2>Sleep mode</h2><div class="big" id="slp"><span class="dot"></span><span></span></div><div class="small" id="slpSub"></div></div>
    <div class="card tile"><h2>Working on</h2><div class="big" id="act"><span class="dot"></span><span></span></div><div class="small" id="actSub"></div></div>
    <div class="card tile"><h2>Start at boot</h2><label class="switch"><input type="checkbox" id="boot" role="switch"><span id="bootText">Checking…</span></label><div class="small" id="bootSub"></div></div>
  </section>

  <section class="grid4">
    <div class="card"><h2>Messages answered</h2><div class="num" id="nMsg">0</div></div>
    <div class="card"><h2>Tokens generated</h2><div class="num" id="nTok">0</div></div>
    <div class="card"><h2>Incoming requests</h2><div class="num" id="nReq">0</div></div>
    <div class="card"><h2>Errors</h2><div class="num" id="nErr">0</div></div>
  </section>

  <section class="cols">
    <div class="card">
      <h2>In GPU memory <span class="spacer"></span><button id="freeGpu">Free GPU memory</button></h2>
      <div class="models" id="models"></div>
    </div>
    <div class="card">
      <h2>Live activity</h2>
      <div class="feed" id="feed"></div>
    </div>
  </section>
</div>

<script>
const $ = (s) => document.querySelector(s);
let S = null, seen = new Set(), first = true;

function ago(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60); if (m < 60) return m + " min";
  const h = Math.floor(m / 60); return h + " h " + (m % 60) + " min";
}
function gb(b) { return b ? (b / 1e9).toFixed(1) + " GB" : "—"; }
function fmt(n) { return Math.round(n).toLocaleString(); }
function setTile(id, cls, text, sub) {
  const el = $("#" + id);
  el.className = "big " + cls;
  el.querySelector(".dot").className = "dot " + cls;
  el.lastElementChild.textContent = text;
  $("#" + id + "Sub").textContent = sub;
}

function render() {
  if (!S) return;
  const now = Date.now(), skew = now - S.now;
  $("#pcName").textContent = "· " + S.name;
  $("#uptime").textContent = "Running for " + ago(now - skew - S.startedAt);

  const online = S.connection === "online";
  $("#code").innerHTML = "";
  const [a, b] = (S.code || "····-····").split("-");
  $("#code").append(a, Object.assign(document.createElement("span"), { className: "dash", textContent: "-" }), b || "");
  $("#hero").classList.toggle("off", !online);
  $("#link").textContent = S.link || S.server;
  $("#heroState").textContent = online ? "Share this code to let a device use this PC's AI" : "Not shared right now, waiting for the server…";
  $("#heroState").style.color = online ? "var(--ok)" : "var(--warn)";

  setTile("srv", online ? "ok" : S.connection === "connecting" ? "warn" : "bad",
    online ? "Online" : S.connection === "connecting" ? "Connecting…" : "Reconnecting…",
    (online ? "for " : "since ") + ago(now - skew - S.connectionSince) + " · " + S.server.replace(/^https?:\/\//, ""));
  const o = S.ollama;
  setTile("oll", o.up ? "ok" : "bad", o.up ? "Running" : "Not running",
    o.up ? `v${o.version} · ${o.models.length} model${o.models.length === 1 ? "" : "s"} loaded` : "Start Ollama on this PC");
  setTile("slp", S.awake ? "ok" : "warn", S.awake ? "Blocked" : "Allowed",
    S.awake ? "PC stays awake while Burrow runs" : "Couldn't block sleep");
  const live = S.log.filter((e) => e.active && e.kind === "chat");
  setTile("act", S.active ? "warn" : "ok", S.active ? `${S.active} request${S.active === 1 ? "" : "s"}` : "Idle",
    live.length ? `Answering with ${live[0].model}…` : "Waiting for messages");

  const boot = $("#boot");
  if (bootPending && S.autostart === bootPending.want) bootPending = null;
  if (bootPending && now - bootPending.at > 180000) bootPending = null;
  boot.checked = bootPending ? bootPending.want : !!S.autostart;
  boot.disabled = S.autostart === null || !!bootPending;
  $("#bootText").textContent = S.autostart === null ? "Not available" : boot.checked ? "On" : "Off";
  $("#bootSub").textContent = bootError || (bootPending
    ? (bootPending.want ? "Confirm in the window that opened: allow admin, then enter your Windows password" : "Confirm in the window that opened (allow admin)")
    : S.autostart ? "Ollama and Burrow start when the PC boots, even before you sign in" + (S.background ? " (running that way now)" : "")
    : S.autostart === false ? "Only runs when you start burrow-host.bat" : "Needs Windows");

  $("#nMsg").textContent = fmt(S.totals.messages);
  $("#nTok").textContent = fmt(S.totals.tokens + live.reduce((t, e) => t + e.tokens, 0));
  $("#nReq").textContent = fmt(S.totals.requests);
  $("#nErr").textContent = fmt(S.totals.errors);
  $("#nErr").style.color = S.totals.errors ? "var(--bad)" : "";

  const mEl = $("#models"); mEl.innerHTML = "";
  if (!o.models.length) mEl.innerHTML = `<div class="empty">${o.up ? "Nothing loaded, GPU memory is free." : "Ollama isn't running."}</div>`;
  for (const m of o.models) {
    const d = document.createElement("div"); d.className = "model";
    d.innerHTML = "<b></b><small></small>";
    d.querySelector("b").textContent = m.name;
    const left = m.expires ? new Date(m.expires).getTime() - now : 0;
    d.querySelector("small").textContent = `${gb(m.vram)} in GPU${m.size > m.vram ? ` · ${gb(m.size - m.vram)} in RAM` : ""}` + (left > 0 && left < 864e5 ? ` · unloads in ${ago(left)}` : "");
    mEl.appendChild(d);
  }
  $("#freeGpu").disabled = !o.models.length;

  const feed = $("#feed"); feed.innerHTML = "";
  if (!S.log.length) feed.innerHTML = '<div class="empty" style="padding:6px 8px">Nothing yet. Messages from other devices show up here.</div>';
  for (const e of S.log) {
    const d = document.createElement("div");
    const cls = e.error ? "error" : e.kind === "chat" || e.kind === "unload" ? "chat" : e.kind;
    d.className = "ev " + cls + (!first && !seen.has(e.id) ? " new" : "");
    seen.add(e.id);
    d.innerHTML = '<time></time><span class="dot"></span><div class="what"></div>';
    d.querySelector("time").textContent = new Date(e.time).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    d.querySelector(".dot").className = "dot " + (e.error || e.kind === "error" ? "bad" : e.active ? "warn" : e.kind === "info" ? "" : "ok");
    const w = d.querySelector(".what");
    if (e.kind === "chat" || e.kind === "unload") {
      const head = document.createElement("div");
      head.innerHTML = '<span class="model-name"></span> <span class="msg"></span>';
      head.firstChild.textContent = e.model || "?";
      head.lastChild.textContent = e.kind === "unload" ? "· unload from GPU" : e.text ? "· “" + e.text + "”" : "";
      const meta = document.createElement("div"); meta.className = "meta";
      if (e.active) meta.innerHTML = `<span class="spin"></span>${e.kind === "chat" ? (e.tokens ? `Answering… ${fmt(e.tokens)} tokens` : "Loading / thinking…") : "Working…"}`;
      else if (e.error) meta.textContent = "Failed: " + e.error;
      else if (e.kind === "chat") meta.textContent = [e.stopped ? "Stopped" : "Answered", e.tokens ? fmt(e.tokens) + " tokens" : "", e.tps ? e.tps.toFixed(1) + " tok/s" : "", e.secs ? e.secs.toFixed(1) + " s" : "", e.loadSecs ? `model loaded in ${e.loadSecs.toFixed(1)} s` : ""].filter(Boolean).join(" · ");
      else meta.textContent = "Done";
      w.append(head, meta);
    } else w.textContent = e.text;
    feed.appendChild(d);
  }
  first = false;
}

function connect() {
  const es = new EventSource("/events");
  es.onmessage = (m) => { S = JSON.parse(m.data); $("#lost").hidden = true; render(); };
  es.onerror = () => { $("#lost").hidden = false; };
}
setInterval(render, 1000);

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); const t = btn.textContent; btn.textContent = "Copied"; setTimeout(() => (btn.textContent = t), 1200); } catch {}
}
$("#copyCode").onclick = (e) => S && copy(S.code, e.target);
$("#copyLink").onclick = (e) => S && copy(S.link || S.server, e.target);
let bootPending = null, bootError = "";
$("#boot").onchange = async (e) => {
  const want = e.target.checked;
  bootError = "";
  bootPending = { want, at: Date.now() };
  render();
  try {
    const r = await fetch("/action/autostart-" + (want ? "on" : "off"), { method: "POST", headers: { "X-Burrow": "1" } });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "HTTP " + r.status);
  } catch (err) { bootPending = null; bootError = err.message; }
  render();
};
$("#freeGpu").onclick = async (e) => {
  e.target.disabled = true;
  try { await fetch("/action/free-gpu", { method: "POST", headers: { "X-Burrow": "1" } }); } finally { e.target.disabled = false; }
};
connect();
</script>
</body>
</html>
