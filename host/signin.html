<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Albatross · Sign in</title>
<style>
  :root { --fg: #1d1d1f; --muted: #6e6e73; --card: #fff; --bg: #f2f4f8; --line: rgba(0,0,0,.1); --ok: #34c759; --bad: #ff3b30; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --muted: #a1a1a6; --card: #1c1c1f; --bg: #111214; --line: rgba(255,255,255,.12); --ok: #30d158; --bad: #ff453a; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 32px 28px; width: min(360px, calc(100vw - 32px)); box-sizing: border-box; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.08); }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 12px 0 6px; }
  p { color: var(--muted); margin: 0 0 20px; }
  button { font: inherit; font-weight: 600; display: inline-flex; align-items: center; gap: 10px; padding: 11px 22px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .6; cursor: default; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
</style>
</head>
<body>
<main>
  <img src="/app/icon-192.png" alt="" onerror="this.remove()">
  <h1>Sign in to Albatross</h1>
  <p id="t">Continue with Google here. The Albatross app on this PC signs in by itself.</p>
  <button id="b" type="button"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Continue with Google</button>
</main>
<script type="module">
// Google refuses sign-in inside app windows (the Windows app, the Chrome sidebar), so the app opens this page in the normal
// browser. After you sign in, Google's token goes to the host on this PC under the app's one-time code (s=), and the app picks it
// up. Nothing stays here: the sign-in on this page lives in memory only.
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeAuth, inMemoryPersistence, browserPopupRedirectResolver, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const auth = initializeAuth(initializeApp({
  apiKey: "AIzaSyAuAODa8DAj8nAgdllfYYqCcS_Syt4-q6Y", authDomain: "albatross-63e62.firebaseapp.com", projectId: "albatross-63e62",
  appId: "1:413247408292:web:2f6af55a73ca422cc43e31",
}), { persistence: inMemoryPersistence, popupRedirectResolver: browserPopupRedirectResolver });
const state = new URLSearchParams(location.search).get("s") || "";
const t = document.getElementById("t"), b = document.getElementById("b");
const say = (text, cls = "") => { t.textContent = text; t.className = cls; };
if (!/^[0-9a-f]{32,64}$/.test(state)) { b.hidden = true; say("This sign-in link isn't complete. Start the sign-in again in Albatross.", "bad"); }
b.onclick = async () => {
  b.disabled = true; say("Signing in…");
  try {
    const r = await signInWithPopup(auth, new GoogleAuthProvider());
    const c = GoogleAuthProvider.credentialFromResult(r);
    const res = await fetch("/signin/done", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ state, idToken: c.idToken, accessToken: c.accessToken }) });
    if (res.status === 410) throw new Error("This sign-in has expired. Start it again in Albatross.");
    if (!res.ok) throw new Error("Albatross didn't take it (" + res.status + "). Start the sign-in again in the app.");
    b.hidden = true; say("Done: you're signed in" + (r.user.email ? " as " + r.user.email : "") + ". Go back to Albatross; you can close this tab.", "ok");
    setTimeout(() => { try { window.close(); } catch {} }, 2500);
  } catch (e) {
    b.disabled = false;
    say(e.code === "auth/popup-closed-by-user" ? "The Google window was closed. Try again."
      : e.code === "auth/popup-blocked" ? "Your browser blocked the Google window. Allow pop-ups for this page, then try again."
      : e.message || String(e), "bad");
  }
};
</script>
</body>
</html>
