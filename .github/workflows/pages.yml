# Publishes the website (landing page + app in /public) to GitHub Pages on every push to main, but only after the smoke
# test (test/smoke.js: the app starts in Chrome, every page opens, the main parts work) has passed.
name: Deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Smoke test (the app in headless Chrome)
        run: node test/smoke.js
  deploy:
    needs: test
    if: github.repository == 'AlbatrossAssistent/AlbatrossAssistent.github.io'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site files
        run: |
          mkdir _site
          cp index.html terms.html privacy.html legal.css _site/
          cp -r public _site/public
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
