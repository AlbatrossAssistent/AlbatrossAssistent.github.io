<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'">
<title>Albatross remote desktop</title>
</head>
<body>
<script>
// Hidden window of the Windows app (desktop/rtc.js): captures one screen and sends it to the other device as WebRTC video. The other
// device made the offer (a video it receives, a data channel for its mouse and keyboard); this answers it.
let pc = null;
const ICE = [{ urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302", "stun:stun.cloudflare.com:3478"] }];
// all candidates gathered (or 4 seconds): one answer with everything in it, no back and forth
const gathered = (p) => new Promise((ok) => { if (p.iceGatheringState === "complete") return ok(); const t = setTimeout(ok, 4000); p.addEventListener("icegatheringstatechange", () => { if (p.iceGatheringState === "complete") { clearTimeout(t); ok(); } }); });
async function start(o) {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { mandatory: { chromeMediaSource: "desktop", chromeMediaSourceId: o.sourceId, maxWidth: o.maxW, maxHeight: o.maxH, maxFrameRate: o.fps, minFrameRate: Math.min(15, o.fps) } } });
  const track = stream.getVideoTracks()[0];
  // a desktop: sharp text matters, but so does moving smoothly; frames are dropped before the picture gets blurry
  try { track.contentHint = "detail"; } catch {}
  pc = new RTCPeerConnection({ iceServers: ICE });
  pc.onconnectionstatechange = () => { rtcApp.state(pc.connectionState); if (pc.connectionState === "failed" || pc.connectionState === "closed") stream.getTracks().forEach((t) => t.stop()); };
  pc.ondatachannel = (e) => {
    const ch = e.channel;
    ch.onmessage = (m) => rtcApp.input(String(m.data));
    ch.onclose = () => rtcApp.state("closed");
  };
  await pc.setRemoteDescription({ type: "offer", sdp: o.sdp });
  const sender = pc.addTrack(track, stream);
  await pc.setLocalDescription(await pc.createAnswer());
  try {
    const p = sender.getParameters();
    p.degradationPreference = "maintain-framerate";
    if (!p.encodings || !p.encodings.length) p.encodings = [{}];
    p.encodings[0].maxBitrate = o.bitrate || 8000000;
    p.encodings[0].maxFramerate = o.fps;
    await sender.setParameters(p);
  } catch {}
  await gathered(pc);
  return pc.localDescription.sdp;
}
</script>
</body>
</html>
